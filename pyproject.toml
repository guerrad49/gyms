[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "PokemonGo"
dynamic = ["version"]
description = "Build and maintain a database of Pokemon GO gold gyms."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PokemonGo contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "geopy>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6"]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "twine>=5",
]
docs = [
    "furo>=2024.4",
    "myst-parser>=3",
    "sphinx>=7.3",
    "sphinx-autodoc-typehints>=2.1",
]

[project.scripts]
pogo = "PokemonGo.cli:main"

# --- version comes from git tags (vX.Y.Z); see PLAN.md section 11.3 --------

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/PokemonGo"]

# --- ruff: 80 columns, numpy docstrings --------------------------------------

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["legacy"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF",
    "D",    # pydocstyle
    "ANN",  # missing annotations
    "PT",   # pytest style
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 80   # W505: docstrings and comments

[tool.ruff.lint.isort]
known-first-party = ["PokemonGo", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests need typed signatures but not docstrings on every test function.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

# --- mypy: strict ------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
exclude = ["^legacy/"]

[[tool.mypy.overrides]]
module = ["cv2.*", "pytesseract.*", "geopy.*", "gspread.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
markers = [
    "ocr: needs the tesseract executable",
    "live: talks to a real service (Sheets, Nominatim); off by default",
]

[tool.coverage.run]
source = ["PokemonGo"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 90
