name: docs

# Builds the Sphinx site and publishes it to GitHub Pages. It also runs after
# the release workflow, so the site is rebuilt once a new tag exists.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags are needed to compute the version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: >-
          sphinx-build -W --keep-going -b html
          docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
